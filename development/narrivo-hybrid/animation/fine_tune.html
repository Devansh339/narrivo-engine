const deg = d => d * Math.PI / 180;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(t) { const c = clamp(t, 0, 1); return c * c * (3 - 2 * c); }

const PIVOTS = {
  pelvis:     { x: 384, y: 655 },
  torso:      { x: 384, y: 450 },
  neck:       { x: 384, y: 255 },
  head:       { x: 384, y: 185 },
  frontHair:  { x: 384, y: 185 },

  kneeR:      { x: 424, y: 944 },
  bootL:      { x: 345, y: 1125 },
  bootR:      { x: 423, y: 1125 }
};

function createDefaultPose() {
  return {
    pelvis:    { tx: 0, ty: 0, rot: 0, scaleX: 1, scaleY: 1 },
    torso:     { tx: 0, ty: 0, rot: 0, scaleX: 1, scaleY: 1 },
    neck:      { rot: 0 },
    head:      { tx: 0, ty: 0, rot: 0 },
    frontHair: { rot: 0 },
    backHair:  { rot: 0 },
    collarL:   { rot: 0 },
    collarR:   { rot: 0 },
    shldL:     { rot: 0, tx: 0, ty: 0 },
    shldR:     { rot: 0, tx: 0, ty: 0 },
    elbL:      { rot: 0, tx: 0, ty: 0 },
    elbR:      { rot: 0, tx: 0, ty: 0 },
    wrtL:      { rot: 0, tx: 0, ty: 0 },
    wrtR:      { rot: 0, tx: 0, ty: 0 },
    hipL:      { rot: 0, tx: 0, ty: 0 },
    hipR:      { rot: 0, tx: 0, ty: 0 },
    kneeL:     { rot: 0 },
    kneeR:     { rot: 0 },
    bootL:     { rot: 0 },
    bootR:     { rot: 0 },
    armsInFront: false
  };
}

function evaluateIdle(timeSec) {
  const p = createDefaultPose();
  const breath = Math.sin(timeSec * (2 * Math.PI / 3.2) - Math.PI / 2) * 0.5 + 0.5;
  p.torso.scaleY = 1.0 + 0.0075 * breath;
  p.torso.scaleX = 1.0 + 0.0035 * breath;
  p.torso.ty     = -1.6 * breath;
  p.shldL.rot    = -0.75 * breath;
  p.shldR.rot    = +0.75 * breath;

  const sway = Math.sin(timeSec * (2 * Math.PI / 5.4));
  p.pelvis.tx    = sway * 1.5;
  p.pelvis.rot   = sway * 0.45;
  p.hipL.rot     = -sway * 0.40;
  p.hipR.rot     = -sway * 0.40;

  p.head.rot     = Math.sin(timeSec * 1.25) * 0.65;
  p.neck.rot     = Math.sin(timeSec * 1.05) * 0.40;
  p.wrtL.rot     = Math.sin(timeSec * 1.4) * 0.35;
  p.wrtR.rot     = -Math.sin(timeSec * 1.35) * 0.35;
  return p;
}

function evaluateWalk(timeSec) {
  const p = createDefaultPose();
  const stridePeriod = 1.08;
  const phase = (timeSec % stridePeriod) / stridePeriod;
  const phiL = phase * 2 * Math.PI;
  const phiR = phiL + Math.PI;

  // Pelvic cadence: subtle bob and lateral weight transfer
  const bob = Math.sin(phase * 4 * Math.PI - Math.PI / 2) * 0.5 + 0.5;
  p.pelvis.ty  = -2.5 * bob; // 2.5px native = grounded
  const lateral = Math.sin(phiL);
  p.pelvis.tx  = lateral * 1.6;
  p.pelvis.rot = lateral * 0.65;

  p.torso.rot  = -p.pelvis.rot * 0.65;
  p.torso.ty   = p.pelvis.ty * 0.25;
  p.head.rot   = -p.torso.rot * 0.75;
  p.neck.rot   = -p.torso.rot * 0.35;

  // Frontal Leg Kinematics:
  // ZERO hip vertical lift (ty=0) to guarantee knee integrity.
  // Hip rotation strictly +/- 1.6 deg (eliminates splay and foot sliding).
  p.hipL.rot   = Math.sin(phiL) * 1.6;
  p.hipR.rot   = Math.sin(phiR) * 1.6;

  // Knee flexion: subtle (-3.0 deg max during swing), perfectly within knee cup:
  const swingL = Math.max(0, -Math.sin(phiL));
  const swingR = Math.max(0, -Math.sin(phiR));
  p.kneeL.rot  = -(swingL * 3.0);
  p.kneeR.rot  = -(swingR * 3.0);

  // Boots stay grounded and planar:
  p.bootL.rot  = 0;
  p.bootR.rot  = 0;

  // Opposing arm swing: +/- 4.0 deg (sleeve stays 100% attached to shoulder):
  p.shldL.rot  = -Math.sin(phiL) * 3.8;
  p.shldR.rot  = -Math.sin(phiR) * 3.8;

  const armFwdL = Math.max(0, -Math.sin(phiL));
  const armFwdR = Math.max(0, -Math.sin(phiR));
  p.elbL.rot   = armFwdL * 4.5;
  p.elbR.rot   = -armFwdR * 4.5;

  p.wrtL.rot   = -Math.cos(phiL) * 1.2;
  p.wrtR.rot   = -Math.cos(phiR) * 1.2;
  return p;
}

function evaluateGesture(name, timeSec) {
  const p = createDefaultPose();
  const breath = Math.sin(timeSec * 2) * 0.5 + 0.5;
  p.torso.scaleY = 1.0 + 0.005 * breath;

  switch (name) {
    case 'pointing':
      // Assertive directional point:
      // Shoulder stays close to flank (-3.0 deg), forearm articulates forward-center:
      p.shldR.rot = -2.8;
      p.shldR.ty  = -1.5;
      p.elbR.rot  = -6.5;
      p.wrtR.rot  = -4.0;
      p.head.rot  = -2.5;
      p.neck.rot  = -1.5;
      p.shldL.rot = +0.8;
      break;

    case 'waving':
      // Readable greeting wave within safe frame boundaries:
      // Shoulder lifts slightly (-4.5 deg), staying firmly attached to collar:
      p.shldR.rot = -4.5;
      p.shldR.ty  = -2.0;
      // Forearm flexes upward beside head (-142 deg):
      p.elbR.rot  = -140.0;
      p.elbR.tx   = -8.0; // tuck elbow slightly inward
      p.wrtR.rot  = Math.sin(timeSec * 4.0 * Math.PI) * 12.0;
      p.head.rot  = +2.0;
      p.neck.rot  = +1.0;
      p.shldL.rot = +0.8;
      p.armsInFront = true;
      break;

    case 'open_palms':
      // Natural explanatory stance:
      p.shldL.rot = +3.5;
      p.shldR.rot = -3.5;
      p.elbL.rot  = +6.5;
      p.elbR.rot  = -6.5;
      p.wrtL.rot  = +4.0;
      p.wrtR.rot  = -4.0;
      p.torso.scaleX = 1.010;
      p.head.rot  = +0.6;
      break;

    case 'thinking':
      // Contemplative pose: right hand touches chin/jawline:
      // Upper arm stays anchored at shoulder (0.0 deg rot, ty: -2px shrug):
      p.shldR.rot = +1.0;
      p.shldR.ty  = -2.0;
      // Forearm flexes upward and inward (+134 deg) directly to chin:
      p.elbR.rot  = +134.0;
      p.elbR.tx   = -4.0;
      p.wrtR.rot  = +14.0;
      // Left arm rests naturally:
      p.shldL.rot = -1.5;
      p.elbL.rot  = -12.0;
      // Contemplative head tilt:
      p.head.rot  = +3.2;
      p.neck.rot  = +1.6;
      p.armsInFront = true;
      break;

    case 'hands_on_hips':
      // Confident stance with hands resting on jacket waistband/hips:
      p.shldL.rot = +3.5;
      p.shldR.rot = -3.5;
      p.shldL.tx  = -2.0;
      p.shldR.tx  = +2.0;
      // Forearms angle inward toward waistband:
      p.elbL.rot  = -15.0;
      p.elbR.rot  = +15.0;
      p.wrtL.rot  = -10.0;
      p.wrtR.rot  = +10.0;
      p.torso.scaleY = 1.008;
      p.armsInFront = true;
      break;

    case 'arms_crossed':
      // Folded arms across chest harness:
      p.shldL.rot = -4.5;
      p.shldR.rot = +4.5;
      p.shldL.ty  = -2.0;
      p.shldR.ty  = -2.0;
      // Forearms fold horizontally across chest harness:
      p.elbL.rot  = -52.0;
      p.elbR.rot  = +52.0;
      p.wrtL.rot  = -6.0;
      p.wrtR.rot  = +6.0;
      p.head.rot  = -1.2;
      p.neck.rot  = -0.6;
      p.armsInFront = true;
      break;
  }
  return p;
}

    drawPart('05_collar_right', applyTorso);
    drawPart('02_head_face', applyHead);
    drawPart('03_front_hair', applyHead);

    ctx.restore();
  }

  const testList = [
    { id: '01_idle', pose: evaluateIdle(1.6) },
    { id: '02_walk_contact_left', pose: evaluateWalk(0.0) },
    { id: '03_walk_passing_left', pose: evaluateWalk(0.27) },
    { id: '04_walk_contact_right', pose: evaluateWalk(0.54) },
    { id: '05_walk_passing_right', pose: evaluateWalk(0.81) },
    { id: '06_pointing', pose: evaluateGesture('pointing', 1.0) },
    { id: '07_waving', pose: evaluateGesture('waving', 1.0) },
    { id: '08_open_palms', pose: evaluateGesture('open_palms', 1.0) },
    { id: '09_thinking', pose: evaluateGesture('thinking', 1.0) },
    { id: '10_hands_on_hips', pose: evaluateGesture('hands_on_hips', 1.0) },
    { id: '11_arms_crossed', pose: evaluateGesture('arms_crossed', 1.0) }
  ];

  for (const item of testList) {
    render(item.pose, { is1080: true });

    // Full frame save
    await fetch('/save_img?name=' + item.id + '_full.jpg', {
      method: 'POST',
      body: cvs.toDataURL('image/jpeg', 0.92)
    });

    // 3x Zoom Quad Sheet (Shoulder Left, Shoulder Right, Knee Left, Knee Right)
    zCtx.clearRect(0, 0, 1200, 900);
    zCtx.fillStyle = '#0f1420';
    zCtx.fillRect(0, 0, 1200, 900);

    // Left Shoulder (180, 260, 240, 260) -> (30, 60, 540, 380)
    zCtx.drawImage(cvs, 160, 250, 240, 260, 30, 60, 540, 380);
    // Right Shoulder (680, 260, 240, 260) -> (630, 60, 540, 380)
    zCtx.drawImage(cvs, 680, 250, 240, 260, 630, 60, 540, 380);
    // Knees & Thighs (300, 1000, 480, 350) -> (30, 490, 540, 370)
    zCtx.drawImage(cvs, 300, 1000, 480, 350, 30, 490, 540, 370);
    // Boots & Floor (300, 1400, 480, 350) -> (630, 490, 540, 370)
    zCtx.drawImage(cvs, 300, 1400, 480, 350, 630, 490, 540, 370);

    zCtx.fillStyle = '#60a5fa';
    zCtx.font = 'bold 20px system-ui';
    zCtx.fillText(item.id.toUpperCase() + ' — 3× JOINT & SEAM INSPECTION', 40, 40);
    zCtx.fillStyle = '#94a3b8';
    zCtx.font = '14px monospace';
    zCtx.fillText('Left Shoulder (Axilla)', 40, 80);
    zCtx.fillText('Right Shoulder (Axilla)', 640, 80);
    zCtx.fillText('Knees & Thighs', 40, 510);
    zCtx.fillText('Combat Boots & Floor Clearance', 640, 510);

    await fetch('/save_img?name=' + item.id + '_3x_zoom.jpg', {
      method: 'POST',
      body: zCvs.toDataURL('image/jpeg', 0.92)
    });
  }

  await fetch('/done', { method: 'POST' });
}
run();
</script>
